<style>
:root{--navy:#1D2E73;--navy2:#14204f;--red:#E7402B;--ink:#1b2133;--mute:#5d6680;--line:#d9dde8;--bg:#eef1f7;--ok:#1f8a4c;--warn:#b7791f;--nav:64px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px}
body.con-nav{padding-bottom:calc(var(--nav) + var(--sab))}
button,input,textarea,select{font:inherit}
[hidden]{display:none!important}
/* splash + login */
#splash{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .3s}
#splash.hide{opacity:0;pointer-events:none}
.logo-card{background:#fff;border-radius:14px;padding:14px 18px}
.logo-card img{width:200px;max-width:60vw;display:block}
#splash small,#login small.sub{color:rgba(255,255,255,.6);letter-spacing:1.5px;font-weight:600;margin-top:14px;font-size:13px}
#login{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:50}
#login form{width:100%;max-width:340px;margin-top:28px}
#login label{color:rgba(255,255,255,.65)}
#login input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.lerr{margin-top:12px;background:rgba(231,64,43,.18);border:1px solid rgba(231,64,43,.4);border-radius:9px;padding:10px 14px;color:#ffd0c9;font-size:14px;text-align:center}
/* barra superior */
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(var(--sat) + 10px) 10px 10px;display:flex;align-items:center;gap:8px;min-height:56px}
header .ib{background:none;border:0;color:#fff;padding:8px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
header .ib svg{width:24px;height:24px}
header .t{flex:1;min-width:0;padding-left:4px}
header .t b{display:block;font:700 19px/1.15 "Barlow Condensed",Barlow,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t span{display:block;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--red);color:#fff;border-radius:20px;padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.chip.gray{background:#e8ebf3;color:var(--mute)}.chip.ok{background:#e1f3e8;color:var(--ok)}.chip.warn{background:#fdf0d9;color:var(--warn)}.chip.red{background:#fde6e2;color:var(--red)}
/* navegación inferior */
nav#bnav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab);height:calc(var(--nav) + var(--sab))}
nav#bnav button{flex:1;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;cursor:pointer;padding:0}
nav#bnav button svg{width:24px;height:24px}
nav#bnav button.on{color:var(--navy)}nav#bnav button.on svg{stroke:var(--red)}
nav#bnav button.cap{color:#fff}
nav#bnav button.cap span.c{width:50px;height:50px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(231,64,43,.4)}
nav#bnav button.cap span.c svg{stroke:#fff}
nav#bnav button.cap em{font-style:normal;color:var(--mute)}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font:700 21px "Barlow Condensed",Barlow,sans-serif;color:var(--navy);margin:6px 2px 10px}
h3{font:700 17px "Barlow Condensed",Barlow,sans-serif;color:var(--navy);margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.help{color:var(--mute);font-size:14px;margin:0 0 10px}
.empty{color:var(--mute);font-size:15px;padding:14px 4px;text-align:center}
label{display:block;font-weight:600;font-size:14px;color:var(--mute);margin:12px 0 5px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:16px}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
input:disabled{background:#f3f4f8;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border:0;border-radius:11px;padding:14px 16px;font-weight:700;font-size:16px;cursor:pointer}
.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.btn:disabled{background:#b8bfd3;cursor:not-allowed;box-shadow:none}
.btn svg{width:20px;height:20px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.linkbtn{background:none;border:0;color:var(--navy);font-weight:600;font-size:14px;padding:8px 2px;cursor:pointer;text-decoration:underline}
.fab{position:fixed;right:18px;bottom:calc(var(--sab) + 22px);width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 8px 20px rgba(231,64,43,.4);cursor:pointer;z-index:9}
body.con-nav .fab{bottom:calc(var(--nav) + var(--sab) + 16px)}
.fab svg{width:28px;height:28px}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mute)}
.search input{padding-left:38px}
/* listas */
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;color:inherit}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px}
.item .tx small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.item .pct{font:700 22px "Barlow Condensed",Barlow,sans-serif;color:var(--navy)}
.item svg.chev{width:20px;height:20px;stroke:var(--mute);flex-shrink:0}
.code{font-weight:700;color:var(--navy);margin-right:6px}
/* barras de avance */
.bar{height:8px;background:#eceff6;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bar i.p{background:#9aa6cc}.bar i.bad{background:var(--red)}
.pp{padding:10px 0;border-top:1px solid var(--line)}
.pp:first-child{border-top:0;padding-top:0}
.pn{font-size:14.5px;display:flex;gap:6px;align-items:baseline}
.pn .v{margin-left:auto;font-weight:700;color:var(--navy);white-space:nowrap}
.pl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpis div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px}
.kpis small{display:block;color:var(--mute);font-size:12.5px}
.kpis b{display:block;font:700 26px "Barlow Condensed",Barlow,sans-serif;color:var(--navy)}
.kpis .bad b{color:var(--red)}.kpis .good b{color:var(--ok)}
.big{font:700 54px/1 "Barlow Condensed",Barlow,sans-serif;color:var(--navy)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal figure{margin:0;position:relative;border-radius:8px;overflow:hidden;background:#dde1ec;aspect-ratio:1}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:11.5px;padding:14px 6px 4px;font-weight:600}
/* evidencias */
.ev{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.ev .ph{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-rows:150px;gap:2px;background:#dde1ec}
.ev .ph img{width:100%;height:150px;object-fit:cover;display:block;min-width:0}
.ev .bd{padding:10px 12px;display:flex;gap:8px}
.ev .tx{flex:1;min-width:0;font-size:14px}
.ev .tx .d{margin:4px 0;font-size:15px}
.ev .tx small{color:var(--mute)}
.ev .rm{background:none;border:0;color:var(--mute);padding:6px;cursor:pointer;align-self:flex-start}
.ev .rm svg{width:20px;height:20px}
.wkh{font-weight:700;color:var(--navy);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.wkh span{color:var(--mute);font-weight:600;font-size:14px}
/* captura */
.step{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);margin-bottom:10px}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px}
.step.done i{background:var(--ok)}
.picker{width:100%;text-align:left;background:#f6f7fb;border:1.5px dashed #b9c1d8;border-radius:10px;padding:14px;cursor:pointer;color:var(--mute);display:flex;align-items:center;gap:10px;font-size:16px}
.picker svg{width:22px;height:22px;flex-shrink:0;stroke:var(--navy)}
.picker.set{background:#fdf3f1;border:1.5px solid var(--red);color:var(--ink)}
.picker small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{aspect-ratio:3/4;border-radius:10px;background:#f6f7fb;border:1.5px dashed #b9c1d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--navy);font-weight:600;font-size:13px;cursor:pointer;position:relative;overflow:hidden;padding:0}
.slot svg{width:34px;height:34px}
.slot.first{background:var(--navy);color:#fff;border:0}.slot.first svg{stroke:#fff}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);border:0;display:grid;place-items:center;z-index:2;padding:0;cursor:pointer}
.slot .x svg{width:16px;height:16px;stroke:#fff}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;padding:0}
.range b{font:700 24px "Barlow Condensed",Barlow,sans-serif;color:var(--navy);min-width:56px;text-align:right}
.unit{position:relative}.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:13px}
.meta span{background:#f0f2f8;border-radius:20px;padding:4px 10px;color:var(--mute)}
.meta span.ok{background:#e5f4ea;color:var(--ok)}
.savebar{position:sticky;bottom:calc(var(--nav) + var(--sab) + 8px);z-index:5}
.savebar .btn{box-shadow:0 6px 18px rgba(231,64,43,.35)}
/* hojas */
.sheet{position:fixed;inset:0;z-index:30;background:#fff;display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .top{padding:calc(var(--sat) + 10px) 10px 10px;background:var(--navy);display:flex;gap:8px;align-items:center;color:#fff}
.sheet .top b{font:700 19px "Barlow Condensed",Barlow,sans-serif;flex:1}
.sheet .top input{border:0}
.sheet .top button{background:none;border:0;color:#fff;padding:8px;cursor:pointer;display:grid;place-items:center}
.sheet .top button svg{width:24px;height:24px;stroke:#fff}
.sheet .body{flex:1;overflow:auto;padding:14px 14px calc(var(--sab) + 20px)}
.sheet .lst{flex:1;overflow:auto;padding-bottom:var(--sab)}
.sheet .lh{padding:12px 14px 6px;font-size:13px;font-weight:700;color:var(--mute)}
.it{padding:12px 14px;border-bottom:1px solid #eef0f5;cursor:pointer;font-size:15px;line-height:1.3}
.it:active,.it.act{background:#eef1fb}
.it.grp{background:#f7f8fb}
.it small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.seg{display:flex;background:#e8ebf3;border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:600;color:var(--mute);cursor:pointer;font-size:14px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:10px;max-height:60vh}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-weight:600;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;background:#f6f7fb}
.covers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.covers img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:7px;border:3px solid transparent;cursor:pointer}
.covers img.on{border-color:var(--red)}
.warn{background:#fff7e0;border:1px solid #f0d58a;border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sab) + 84px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;display:none;z-index:60;max-width:90vw;text-align:center}
.pend{background:#fdf0d9;color:var(--warn);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:900px){nav#bnav{left:50%;right:auto;transform:translateX(-50%);width:720px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
</style>
</head>

/* ═══════════════ UTILIDADES ═══════════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
function corto(n,max){let s=String(n||'').replace(/\s+/g,' ').trim();const i=s.search(/[,.;]?\s*INCLUYE\s*:?/i);if(i>25)s=s.slice(0,i);if(max&&s.length>max)s=s.slice(0,max-1).trim()+'…';return s;}
const money=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const num=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('es-MX',{maximumFractionDigits:2});
const pct=v=>(v==null||isNaN(v)?0:v).toFixed(1)+'%';
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const today=()=>iso(new Date());
function pd(s){const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d);}
const fmtD=d=>String(d.getDate()).padStart(2,'0')+' / '+MESES[d.getMonth()]+' / '+d.getFullYear();
const fmtS=d=>d.getDate()+' '+MESES[d.getMonth()].slice(0,3).toLowerCase();
const fmtF=s=>s?fmtS(pd(s))+' '+String(s).slice(0,4):'—';
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',ms||2800);}
function lunes(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}
function nombreDe(email){const u=S.usuarios.get(email);return u?u.nombre:(email||'').split('@')[0];}
function cmpCode(a,b){const A=String(a).split(/[.\-]/),B=String(b).split(/[.\-]/);for(let i=0;i<Math.max(A.length,B.length);i++){const x=A[i]||'',y=B[i]||'';const nx=+x,ny=+y;
  if(!isNaN(nx)&&!isNaN(ny)&&x!==''&&y!==''){if(nx!==ny)return nx-ny;}else if(x!==y)return x<y?-1:1;}return 0;}

/* ═══════════════ SUPABASE (cliente propio de esta app) ═══════════════
   Este cliente manda el token de Firebase SOLO desde la app de Obras.
   No toca window.tcSupabase del portal ni de la TV de Almacén. */
let _sbP=null;
function sb(){
  if(_sbP)return _sbP;
  _sbP=import('https://esm.sh/@supabase/supabase-js@2').then(m=>m.createClient(SUPABASE_URL,SUPABASE_KEY,{
    accessToken:async()=>auth.currentUser?await auth.currentUser.getIdToken():null,
    db:{schema:'public'},
  })).catch(e=>{_sbP=null;throw e;});
  return _sbP;
}
function conTiempo(p,ms,msg){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(msg||'La conexión tardó demasiado')),ms))]);}
async function q(fn){const c=await sb();const {data,error}=await fn(c);if(error)throw error;return data;}
async function todos(tabla,cols,filtro,orden){
  const c=await sb();let out=[],desde=0;const N=1000;
  for(;;){let r=c.from(tabla).select(cols||'*');if(filtro)r=filtro(r);if(orden)r=r.order(orden);r=r.range(desde,desde+N-1);
    const {data,error}=await r;if(error)throw error;out=out.concat(data);if(data.length<N)break;desde+=N;}
  return out;
}
const urlCache=new Map();
async function firmar(paths){
  const falta=[...new Set(paths.filter(p=>p&&!urlCache.has(p)))];
  for(let i=0;i<falta.length;i+=100){const c=await sb();const {data,error}=await c.storage.from(BUCKET).createSignedUrls(falta.slice(i,i+100),60*60*6);
    if(!error&&data)data.forEach(d=>{if(d.signedUrl)urlCache.set(d.path,d.signedUrl);});}
  return paths.map(p=>urlCache.get(p)||'');
}
async function subir(path,blob){const c=await sb();const {error}=await c.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:true});if(error)throw error;return path;}

/* ═══════════════ COLA SIN CONEXIÓN (IndexedDB) ═══════════════ */
let _db=null;
function idb(){if(!_db)_db=new Promise((ok,ko)=>{const r=indexedDB.open('obras-tc',1);r.onupgradeneeded=()=>r.result.createObjectStore('cola',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});return _db;}
async function colaPut(x){const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction('cola','readwrite');t.objectStore('cola').put(x);t.oncomplete=ok;t.onerror=()=>ko(t.error);});}
async function colaDel(id){const d=await idb();return new Promise(ok=>{const t=d.transaction('cola','readwrite');t.objectStore('cola').delete(id);t.oncomplete=ok;});}

/* ═══════════════ IMÁGENES ═══════════════ */
function comprimir(file,max=1600,qual=.8){
  return new Promise((ok,ko)=>{const u=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
      cv.toBlob(b=>ok({blob:b,url:URL.createObjectURL(b),w,h}),'image/jpeg',qual);};
    im.onerror=()=>{URL.revokeObjectURL(u);ko(new Error('imagen no válida'));};im.src=u;});
}
function blobADataURL(b){return new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b);});}
function recortar(src,ar){
  return new Promise((ok,ko)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const W=im.naturalWidth,H=im.naturalHeight;let sw=W,sh=H,sx=0,sy=0;
    if(sw/sh>ar){sw=Math.round(sh*ar);sx=Math.round((W-sw)/2);}else{sh=Math.round(sw/ar);sy=Math.round((H-sh)/2);}
    const k=Math.min(1,1400/Math.max(sw,sh));const cv=document.createElement('canvas');cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
    cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.82));};im.onerror=()=>ko(new Error('No se pudo cargar una foto'));im.src=src;});
}
async function fotoDataURL(path){const [u]=await firmar([path]);if(!u)throw new Error('Foto no disponible');const r=await fetch(u);return blobADataURL(await r.blob());}
function normCode(v){
  if(v==null)return '';
  if(typeof v==='number'){const s=String(v);if(!s.includes('.'))return s;const [a,b]=s.split('.');return a+'.'+(b.length===1?b+'0':b);}
  return String(v).trim().replace(/\s*-\s*/g,'-').replace(/\s+/g,' ');
}
function isNumCode(c){return /^\d+(\.\d+)*$/.test(c);}
function topOf(c){return isNumCode(c)?c.split('.')[0]:'AD';}
function grpOf(c){if(!isNumCode(c))return null;const p=c.split('.');return p.length>=2?p[0]+'.'+p[1]:null;}

function parseWB(wb){
  const out=[];const seen=new Set();let info={};
  wb.SheetNames.filter(n=>/ESTIMACI/i.test(n)).forEach(name=>{
    const adic=/ADICIONAL/i.test(name);
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    let hi=-1,cC=-1,cN=-1;
    for(let i=0;i<Math.min(rows.length,60);i++){
      const r=rows[i]||[];const a=r.findIndex(v=>norm(v)==='CLAVE');const b=r.findIndex(v=>/^CONCEPTO/.test(norm(v)));
      if(a>=0&&b>=0){hi=i;cC=a;cN=b;break;}
    }
    if(hi<0)return;
    const sub=rows[hi+1]||[];
    const cU=sub.findIndex(v=>/^UNIDAD/.test(norm(v)));
    const cQ=sub.findIndex(v=>/^CANTIDAD/.test(norm(v)));
    const cP=sub.findIndex(v=>/PRECIO UNITARIO/.test(norm(v)));
    for(let i=0;i<hi;i++){const r=rows[i]||[];const k=r.findIndex(v=>norm(v)==='CLIENTE:');
      if(k>=0&&rows[i+1]){const u=r.findIndex(v=>/^UBICACI/.test(norm(v)));if(!info.cli&&rows[i+1][k])info.cli=String(rows[i+1][k]).trim();if(!info.ubi&&u>=0&&rows[i+1][u])info.ubi=String(rows[i+1][u]).replace(/\s+/g,' ').trim();}}
    if(adic&&!seen.has('AD')){seen.add('AD');out.push({c:'AD',n:'CONCEPTOS ADICIONALES',u:'',q:null,pu:null,l:1});}
    for(let i=hi+2;i<rows.length;i++){
      const r=rows[i]||[];const c=normCode(r[cC]);const n=r[cN];
      if(!c||!n||/TOTAL|^IVA$/.test(norm(c)))continue;
      if(seen.has(c))continue;seen.add(c);
      const q=cQ>=0&&typeof r[cQ]==='number'?r[cQ]:null;
      const pu=cP>=0&&typeof r[cP]==='number'?r[cP]:null;
      const l=isNumCode(c)?c.split('.').length:2;
      out.push({c,n:String(n).replace(/\s+/g,' ').trim(),u:cU>=0&&r[cU]?String(r[cU]).trim():'',q:l===1?null:q,pu,l});
    }
  });
  if(!out.length)parseNivel(wb,out,seen);
  // partidas de primer nivel que faltan en el archivo
  const tops=new Set(out.map(x=>topOf(x.c)));
  tops.forEach(t=>{if(!seen.has(t))out.push({c:t,n:'PARTIDA '+t,u:'',q:null,pu:null,l:1});});
  return {cat:out,info,prog:parseProg(wb)};
}

/* catálogo con columna NIVEL (Nivel 3/4/5, Concepto, Equipo) */
function parseNivel(wb,out,seen){
  wb.SheetNames.forEach(name=>{
    if(out.length)return;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    let hi=-1,c={};
    for(let i=0;i<Math.min(rows.length,30);i++){const r=(rows[i]||[]).map(norm);
      const a=r.indexOf('NIVEL'),b=r.indexOf('CLAVE');
      if(a>=0&&b>=0){hi=i;c={niv:a,cl:b,co:r.findIndex(v=>/^CONCEPTO/.test(v)),u:r.findIndex(v=>/^UNIDAD/.test(v)),q:r.findIndex(v=>/^CANTIDAD/.test(v)),pu:r.findIndex(v=>/^PU\b|PRECIO UNITARIO/.test(v)),t:r.findIndex(v=>v==='TOTAL'||v==='IMPORTE')};break;}}
    if(hi<0)return;
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i]||[];const nv=norm(r[c.niv]);const code=normCode(r[c.cl]);const n=r[c.co];
      if(!nv||!code||!n||/^NIVEL [12]$/.test(nv))continue;
      if(seen.has(code))continue;seen.add(code);
      const leaf=nv==='CONCEPTO'||nv==='EQUIPO';
      const q=leaf&&typeof r[c.q]==='number'?r[c.q]:null;
      const pu=leaf&&typeof r[c.pu]==='number'?r[c.pu]:null;
      const tot=c.t>=0&&typeof r[c.t]==='number'?r[c.t]:null;
      const it={c:code,n:String(n).replace(/\s+/g,' ').trim(),u:leaf&&r[c.u]?String(r[c.u]).trim():'',q,pu,l:isNumCode(code)?code.split('.').length:2};
      if(leaf&&tot==null&&q&&pu)it.sinImp=true;
      if(nv==='EQUIPO')it.eq=true;
      out.push(it);
    }
  });
}

/* programa de trabajo: % por partida principal y mes */
function parseProg(wb){
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    for(let i=0;i<Math.min(rows.length,40);i++){
      const r=(rows[i]||[]).map(norm);
      const cc=r.indexOf('CLAVE'),cp=r.findIndex(v=>/^PARTIDA/.test(v)),ci=r.findIndex(v=>/^IMPORTE/.test(v)),ct=r.lastIndexOf('TOTAL');
      if(cc<0||cp<0||ci<0||ct<=ci+1)continue;
      const meses=[];for(let k=ci+1;k<ct;k++)meses.push(String(rows[i][k]||'Mes '+(k-ci)).trim());
      const filas=[];
      for(let j=i+1;j<rows.length;j++){
        const x=rows[j]||[];const k=normCode(x[cc]);
        if(norm(x[cc])==='TOTAL'||!k)break;
        const pct=meses.map((_,m)=>typeof x[ci+1+m]==='number'?x[ci+1+m]:0);
        const imp=typeof x[ci]==='number'?x[ci]:0;
        filas.push({c:k,n:String(x[cp]||'').trim(),imp,pct});
      }
      if(!filas.length)continue;
      let ant=null;
      wb.SheetNames.forEach(n2=>{XLSX.utils.sheet_to_json(wb.Sheets[n2],{header:1,raw:true,defval:null}).forEach(rr=>{
        if(!rr)return;const a=rr.findIndex(v=>/^ANTICIPO \(%\)/.test(norm(v)));if(a>=0&&typeof rr[a+1]==='number'&&ant==null)ant=rr[a+1];});});
      return {meses,filas,ant,hoja:name};
    }
  }
  return null;
}

function formUsuario(u){
  const nuevo=!u;u=u||{rol:'residente',activo:true};

    <label for="fu-em">Empresa (prestadores externos)</label><input id="fu-em" value="${esc(u.empresa||'')}">
    <label for="fu-t">Teléfono</label><input id="fu-t" type="tel" value="${esc(u.telefono||'')}">
    ${nuevo?`<label for="fu-p">Contraseña inicial</label><input id="fu-p" type="text" placeholder="Mínimo 6 caracteres">
      <p class="help" style="margin-top:6px">Si el correo ya tiene cuenta del portal, no se usa la contraseña: entra con la de siempre.</p>`:
      `<label><input type="checkbox" id="fu-a" style="width:auto;margin-right:8px"${u.activo?' checked':''}>Activo</label>`}
    <div style="height:14px"></div><button class="btn red" id="fu-s">${IC.check}Guardar</button>`);
  $('fu-s').onclick=async()=>{

    const b=$('fu-s');b.disabled=true;

        const pass=$('fu-p').value;

/* ═══════════════ ABRIR OBRA Y CARGAR DATOS ═══════════════ */
async function abrirObra(id){
  barra(false);head('Cargando…','',true);$('view').innerHTML='<p class="empty">Cargando obra…</p>';
  try{
    const o=S.obras.find(x=>x.id===id)||await q(c=>c.from('obras').select('*').eq('id',id).single());
    S.obra=o;S.tab='resumen';
    await cargarDatos();
    push(vObra);abrirCanal();
  }catch(e){console.error(e);toast('No se pudo abrir la obra: '+e.message,5000);}
}
async function cargarDatos(){
  const id=S.obra.id;const f=r=>r.eq('obra_id',id);
  const [cat,prog,ev,sol,herr,rep,mie,reps,av]=await Promise.all([
    todos('obra_conceptos','*',f,'orden'),todos('obra_programa','*',f),
    todos('obra_evidencias','*',f,'fecha'),todos('obra_solicitudes','*',f,'creado_en'),
    todos('obra_herramientas','*',f,'creado_en'),todos('obra_reprogramaciones','*',f,'creado_en'),
    todos('obra_miembros','*',f),todos('obra_reportes','*',f),avanceRPC()]);
  S.cat=cat.sort((a,b)=>cmpCode(a.clave,b.clave));S.programa=prog;S.ev=ev;S.sol=sol;S.herr=herr;S.reprog=rep;S.miembros=mie;S.reportes=reps;S.av=av;
  S.byCode=new Map(S.cat.map(c=>[c.clave,c]));
  S.precios=new Map();
  if(esDir()){try{(await todos('obra_precios','*',f)).forEach(p=>S.precios.set(p.clave,p));}catch(e){}}
  const m=mie.find(x=>x.email===S.me.email);S.rolObra=m?m.rol_obra:null;
  try{const us=await q(c=>c.from('obra_usuarios').select('email,nombre,rol,empresa'));us.forEach(u=>S.usuarios.set(u.email,Object.assign(S.usuarios.get(u.email)||{},u)));}catch(e){}
}
async function avanceRPC(){
  try{const r=await q(c=>c.rpc('obra_avance',{p_obra:S.obra.id}));const m=new Map();r.forEach(x=>m.set(x.partida,x));return m;}
  catch(e){console.warn('obra_avance',e.message);return null;}
}
async function refrescar(){try{await cargarDatos();pintar();}catch(e){toast('No se pudo actualizar');}}

/* tiempo real: avisa cuando alguien sube evidencia o solicitud */
async function abrirCanal(){
  cerrarCanal();try{const c=await sb();const id=S.obra.id;
    S.canal=c.channel('obra-'+id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'obra_evidencias',filter:'obra_id=eq.'+id},p=>{
        if(S.ev.some(e=>e.id===p.new.id))return;S.ev.push(p.new);aplicarLocal(p.new);if(p.new.creado_por!==S.me.email)toast('Nueva evidencia de '+nombreDe(p.new.creado_por));actualizarAvance();})
      .on('postgres_changes',{event:'*',schema:'public',table:'obra_solicitudes',filter:'obra_id=eq.'+id},p=>{
        const i=S.sol.findIndex(s=>s.id===p.new.id);if(i>=0)S.sol[i]=p.new;else{S.sol.push(p.new);if(p.new.creado_por!==S.me.email)toast(TIPOS_SOL[p.new.tipo]+': '+p.new.titulo,5000);}})
      .subscribe();}catch(e){console.warn(e);}
}
function cerrarCanal(){if(S.canal){S.canal.unsubscribe();S.canal=null;}}
async function actualizarAvance(){S.av=await avanceRPC();}

/* ═══════════════ CATÁLOGO: ayudas ═══════════════ */
const hojas=()=>S.cat.filter(c=>!c.es_grupo);
const nombreC=k=>{const c=S.byCode.get(k);return c?corto(c.descripcion,90):k;};
function etiquetaPartida(p){if(p==='AD')return 'ADICIONALES';const c=S.byCode.get(p);return p+'.00 '+(c?corto(c.descripcion,60):'');}
const grupoDe=k=>{const p=String(k).split('.');return p.length>=3?p[0]+'.'+p[1]:null;};
function avanceC(c){return Math.max(Number(c.avance_pct)||0,c.cantidad>0?Math.min(100,(Number(c.cantidad_ejecutada)||0)/c.cantidad*100):0);}
function finC(c){return c.fecha_fin_reprog||c.fecha_fin_prog;}
const vencido=c=>!c.es_grupo&&finC(c)&&finC(c)<today()&&avanceC(c)<100;
function partidas(){return [...new Set(S.cat.map(c=>c.partida))].sort(cmpCode);}
function avancePartida(p){
  if(S.av&&S.av.get(p))return Number(S.av.get(p).avance);
  const l=hojas().filter(c=>c.partida===p);return l.length?l.reduce((a,c)=>a+avanceC(c),0)/l.length:0;
}
function avanceGeneral(){if(S.av&&S.av.get('*'))return Number(S.av.get('*').avance);const l=hojas();return l.length?l.reduce((a,c)=>a+avanceC(c),0)/l.length:0;}
/* programa: % programado acumulado a una fecha */
function fracMes(mes,corte){const a=pd(mes),b=new Date(a.getFullYear(),a.getMonth()+1,1);return Math.max(0,Math.min(1,(corte.getTime()+DAY-a)/(b-a)));}
function programadoPartida(p,corte){const l=S.programa.filter(r=>r.partida===p);if(!l.length)return null;return l.reduce((a,r)=>a+Number(r.pct)*fracMes(r.mes,corte),0)*100;}

document.querySelectorAll('#bnav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;reemplazar(vObra);});

  if(!S.cat.length){$('view').innerHTML=`<div class="card"><h3>Falta el catálogo</h3><p class="help">Esta obra todavía no tiene catálogo de conceptos. ${puedeAdm()?'Cárgalo desde Más → Catálogo y programa.':'Pide al encargado que lo cargue.'}</p>
    ${puedeAdm()?'<button class="btn" id="irCat">'+IC.up+'Cargar catálogo</button>':''}</div>`;if($('irCat'))$('irCat').onclick=()=>push(vCatalogo);return;}
  const g=avanceGeneral();const corte=new Date();

  const parts=partidas();const hayProg=S.programa.length>0;

  if(hayProg&&esDir()&&S.precios.size){let t=0,pr=0;parts.forEach(p=>{const imp=hojas().filter(c=>c.partida===p).reduce((a,c)=>{const x=S.precios.get(c.clave);return a+(x&&x.importe?Number(x.importe):0);},0);const pp=programadoPartida(p,corte);if(pp!=null&&imp){t+=imp;pr+=imp*pp/100;}});progG=t?pr/t*100:null;}
  // última foto por partida
  const ult=new Map();[...S.ev].sort((a,b)=>(b.fecha+b.creado_en).localeCompare(a.fecha+a.creado_en)).forEach(e=>{const p=(S.byCode.get(e.concepto_clave)||{}).partida;if(p&&!ult.has(p)&&e.fotos&&e.fotos.length)ult.set(p,e);});
  $('view').innerHTML=`
    <div class="card" style="display:flex;align-items:center;gap:14px">
      <div style="flex:1"><small class="help" style="margin:0">Avance general de la obra</small><div class="big">${pct(g)}</div>
      ${progG!=null?`<small class="help" style="margin:0">Programado al día: <b>${pct(progG)}</b> · ${g>=progG?'<span class="chip ok">En tiempo</span>':'<span class="chip red">Atraso '+pct(progG-g)+'</span>'}</small>`:''}
      <div class="bar"><i style="width:${Math.min(100,g)}%"></i></div></div></div>
    <div class="kpis">
      <div><small>Evidencias</small><b>${S.ev.length}</b></div>

      <div class="${venc.length?'bad':''}" id="kVen" style="cursor:pointer"><small>Conceptos vencidos</small><b>${venc.length}</b></div>
    </div>
    <div class="card"><h3>Avance por área</h3>${parts.map(p=>{const a=avancePartida(p),pp=hayProg?programadoPartida(p,corte):null;
      return `<div class="pp"><div class="pn"><span class="code">${esc(p==='AD'?'AD':p+'.00')}</span>${esc(etiquetaPartida(p).replace(/^\S+\s/,''))}<span class="v">${pct(a)}</span></div>
      <div class="bar"><i class="${pp!=null&&a+0.05<pp?'bad':''}" style="width:${Math.min(100,a)}%"></i></div>
      ${pp!=null?`<div class="bar"><i class="p" style="width:${Math.min(100,pp)}%"></i></div><div class="pl"><span>Real ${pct(a)}</span><span>Programado ${pct(pp)}</span></div>`:''}</div>`;}).join('')}</div>
    ${ult.size?`<div class="card"><h3>Progreso por área (última foto)</h3><div class="gal" id="galA">${[...ult].map(([p,e])=>`<figure data-p="${esc(e.fotos[0])}"><img alt=""><figcaption>${esc(etiquetaPartida(p).replace(/^\S+\s/,'').slice(0,28))}<br>${esc(fmtF(e.fecha))}</figcaption></figure>`).join('')}</div></div>`:''}
    ${venc.length?`<div class="card"><h3>Vencimientos</h3>${venc.slice(0,6).map(c=>`<button class="item" data-c="${esc(c.clave)}" style="margin-bottom:6px"><div class="tx"><b><span class="code">${esc(c.clave)}</span>${esc(corto(c.descripcion,60))}</b><small>Vencía ${esc(fmtF(finC(c)))} · avance ${pct(avanceC(c))}</small></div>${IC.chev}</button>`).join('')}</div>`:''}`;

async function cargarFotos(box){if(!box)return;const fs=[...box.querySelectorAll('[data-p]')];if(!fs.length)return;const urls=await firmar(fs.map(f=>f.dataset.p));fs.forEach((f,i)=>{const im=f.tagName==='IMG'?f:f.querySelector('img');if(im&&urls[i])im.src=urls[i];});}

/* ─────────── SEMANAS ─────────── */
function tSemanas(){
  if(!S.obra.fecha_inicio){$('view').innerHTML=`<div class="card"><h3>Falta la fecha de inicio</h3><p class="help">Captura el lunes de la semana 1 en los datos de la obra para poder agrupar por semana.</p>${puedeAdm()?'<button class="btn" id="eo">Editar datos de la obra</button>':''}</div>`;if($('eo'))$('eo').onclick=()=>formObra(S.obra);return;}
  const cur=Math.max(1,semana(today()));const maxEv=Math.max(0,...S.ev.map(e=>e.semana||semana(e.fecha)));
  const n=Math.max(cur,maxEv);let h='';
  for(let w=n;w>=1;w--){const [a,b]=rango(w);const l=S.ev.filter(e=>(e.semana||semana(e.fecha))===w);const r=S.reportes.find(x=>x.semana===w);
    const est=r?r.estado:(w<cur&&l.length?'pendiente':'');
    h+=`<button class="item" data-w="${w}"><div class="tx"><b>Semana ${w}${w===cur?' · en curso':''}</b><small>${fmtS(a)} – ${fmtS(b)} · ${l.length} evidencia${l.length===1?'':'s'}</small></div>
      ${est?`<span class="chip ${est==='enviado'?'ok':est==='pendiente'?'red':'warn'}">${est==='pendiente'?'Reporte pendiente':est}</span>`:''}${IC.chev}</button>`;}
  $('view').innerHTML=h;
  $('view').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.semSel=+b.dataset.w;push(vSemana);});

  $('view').innerHTML=`
    <div class="card"><h3>Reporte semanal</h3>
      <p class="help">${l.length} evidencias en ${new Set(l.map(e=>(S.byCode.get(e.concepto_clave)||{}).partida)).size} partidas. ${r?'Estado: <b>'+esc(r.estado)+'</b>.':''}</p>
      ${fotos.length?`<label style="margin-top:0">Foto de portada</label><div class="covers" id="cov">${fotos.map(f=>`<img data-k="${f.k}" data-p="${esc(f.p)}" class="${S.cover[w]===f.k?'on':''}" alt="">`).join('')}</div>`:''}
      <label for="rf">Fecha de entrega (portada)</label><input type="date" id="rf" value="${iso(new Date(b.getTime()+DAY))}">
      <div class="btns"><button class="btn red" id="gen" ${l.length?'':'disabled'}>${IC.dl}Descargar PowerPoint</button>
      ${puedeAdm()&&l.length?`<button class="btn ghost" id="env">${IC.check}${r&&r.estado==='enviado'?'Enviado':'Marcar como enviado'}</button>`:''}</div></div>
    ${progSem.length?`<div class="card"><h3>Programado para esta semana</h3>${progSem.map(c=>`<div class="pp" data-c="${esc(c.clave)}" style="cursor:pointer"><div class="pn"><span class="code">${esc(c.clave)}</span>${esc(corto(c.descripcion,70))}<span class="v">${pct(avanceC(c))}</span></div><div class="bar"><i class="${vencido(c)?'bad':''}" style="width:${avanceC(c)}%"></i></div></div>`).join('')}</div>`:''}
    <h2>Evidencias</h2><div id="evs">${l.length?'':'<p class="empty">Sin evidencias esta semana.</p>'}</div>`;

  $('view').querySelectorAll('.pp[data-c]').forEach(d=>d.onclick=()=>verConcepto(d.dataset.c));

      S.reportes=await todos('obra_reportes','*',x=>x.eq('obra_id',S.obra.id));}
    catch(e){console.error(e);toast('Error al generar: '+e.message,5000);}
    bt.disabled=false;bt.innerHTML=IC.dl+'Descargar PowerPoint';};
  if($('env'))$('env').onclick=async()=>{try{await q(c=>c.from('obra_reportes').upsert({obra_id:S.obra.id,semana:w,estado:'enviado',generado_por:S.me.email},{onConflict:'obra_id,semana'}));

}
function pintarEvidencias(box,l){
  box.innerHTML=l.map(e=>{const c=S.byCode.get(e.concepto_clave);const borr=e.creado_por===S.me.email||puedeAdm();
    return `<div class="ev"><div class="ph">${(e.fotos||[]).map(p=>`<img data-p="${esc(p)}" alt="">`).join('')}</div>

    ${borr?`<button class="rm" data-id="${e.id}" aria-label="Eliminar evidencia">${IC.trash}</button>`:''}</div></div>`;}).join('')||box.innerHTML;
  cargarFotos(box);
  box.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar esta evidencia? Las fotos también se borran.'))return;

      S.ev=S.ev.filter(x=>x.id!==e.id);aplicarLocal(e);toast('Evidencia eliminada');actualizarAvance();pintar();}catch(err){toast('No se pudo eliminar: '+err.message);}});

/* ─────────── CAPTURAR ─────────── */
let draft={clave:null,fotos:[],avance:null};let gps=null;
function tCapturar(){
  if(!puedeCap()){$('view').innerHTML='<div class="card"><h3>Solo consulta</h3><p class="help">Tu rol en esta obra no permite capturar evidencias.</p></div>';return;}
  if(!S.cat.length){$('view').innerHTML='<div class="card"><p class="help">Primero hay que cargar el catálogo de la obra.</p></div>';return;}
  $('view').innerHTML=`<div id="pendbox"></div>
  <div class="card"><div class="step" id="st1"><i>1</i>Concepto</div>
    <button class="picker" id="pk" type="button">${IC.search}<span id="pkTx"></span></button></div>
  <div class="card"><div class="step" id="st2"><i>2</i>Fotos (hasta 3)</div><div class="slots" id="phs"></div>
    <button class="linkbtn" id="gal" type="button">Elegir de la galería</button></div>
  <div class="card"><div class="step" id="st3"><i>3</i>Descripción y avance</div>
    <textarea id="desc" placeholder="Qué se hizo. Ej: Colado de columnas de fosa de tanques hasta altura inferior de trabes"></textarea>
    <label for="com">Comentario (opcional)</label><input id="com" placeholder="Observaciones, faltantes, clima…">
    <label for="av">% de cumplimiento del concepto</label><div class="range"><input type="range" id="av" min="0" max="100" step="5"><b id="avV"></b></div>
    <label for="cant">Cantidad ejecutada (opcional)</label><div class="unit"><input id="cant" type="number" step="any" inputmode="decimal" placeholder="Para el generador"><span id="cantU"></span></div>
    <div class="meta"><span>${IC.clock.replace('<svg','<svg width="13" height="13"')} <span id="mF"></span></span><span id="mG">Ubicación pendiente</span></div>
    <button class="linkbtn" id="chF" type="button">Cambiar fecha</button><input type="date" id="fec" hidden></div>
  <div class="savebar"><button class="btn red" id="bsave" disabled>${IC.check}Guardar evidencia</button></div>`;
  $('pk').onclick=()=>abrirBuscador(c=>{draft.clave=c.clave;draft.avance=null;pintaCaptura();});
  $('gal').onclick=()=>{fotoDestino=null;$('fgal').click();};
  $('desc').oninput=chk;$('av').oninput=()=>{draft.avance=+$('av').value;$('avV').textContent=draft.avance+'%';};
  $('chF').onclick=()=>{$('fec').hidden=false;$('chF').hidden=true;};
  $('fec').value=today();$('fec').oninput=fechaTx;
  $('bsave').onclick=guardarEvidencia;
  pintaCaptura();pintarPendientes();fechaTx();if(gps)gpsOk();
}
function fechaTx(){const f=$('fec').value||today();const w=semana(f);$('mF').textContent=(f===today()?'Hoy':fmtF(f))+(w>0?' · semana '+w:'');}
function pintaCaptura(){
  const c=draft.clave&&S.byCode.get(draft.clave);const b=$('pk');if(!b)return;
  if(c){b.classList.add('set');const g=grupoDe(c.clave);
    $('pkTx').innerHTML=`<span class="code">${esc(c.clave)}</span>${esc(corto(c.descripcion,80))}<small>${esc(etiquetaPartida(c.partida))}${g&&g!==c.clave?' / '+esc(nombreC(g)):''} · toca para cambiar</small>`;
    const grp=c.es_grupo;$('cant').disabled=grp;$('cant').placeholder=grp?'Solo para conceptos, no para grupos':'Para el generador';$('cantU').textContent=grp?'':(c.unidad||'');
    const a=draft.avance!=null?draft.avance:Math.round(avanceC(c)/5)*5;$('av').value=a;$('avV').textContent=a+'%';draft.avance=a;}
  else{b.classList.remove('set');$('pkTx').textContent='Toca para buscar el concepto del catálogo';$('av').value=0;$('avV').textContent='0%';}
  const ph=$('phs');let h='';
  for(let i=0;i<3;i++){const f=draft.fotos[i];
    if(f)h+=`<div class="slot"><img src="${f.url}" alt="Foto ${i+1}"><button class="x" data-r="${i}" aria-label="Quitar foto">${IC.x}</button></div>`;
    else if(i===draft.fotos.length)h+=`<button class="slot${i===0?' first':''}" id="shoot" type="button">${IC.cam}${i===0?'Tomar foto':'Otra foto'}</button>`;
    else h+='<div class="slot" style="opacity:.35;cursor:default"></div>';}
  ph.innerHTML=h;if($('shoot'))$('shoot').onclick=()=>{fotoDestino=null;$('fcam').click();};
  ph.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{draft.fotos.splice(+x.dataset.r,1);pintaCaptura();});
  $('gal').hidden=draft.fotos.length>=3;chk();
}
function chk(){const a=!!draft.clave,b=draft.fotos.length>0,c=!!($('desc')&&$('desc').value.trim());
  $('st1').classList.toggle('done',a);$('st2').classList.toggle('done',b);$('st3').classList.toggle('done',c);$('bsave').disabled=!(a&&b&&c);}
async function agregarFotos(list,destino){
  const arr=destino||draft.fotos;const files=[...list].slice(0,3-arr.length);
  for(const f of files){try{arr.push(await comprimir(f));}catch(e){toast('Una foto no se pudo leer');}}
  if(!destino){pintaCaptura();pedirGps();}
}
let fotoDestino=null,fotoCb=null;
$('fcam').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(fotoDestino){await agregarFotos(fs,fotoDestino);fotoCb&&fotoCb();}else agregarFotos(fs);};
$('fgal').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(fotoDestino){await agregarFotos(fs,fotoDestino);fotoCb&&fotoCb();}else agregarFotos(fs);};
function pedirGps(){
  if(gps||!navigator.geolocation)return;if($('mG'))$('mG').textContent='Obteniendo ubicación…';
  navigator.geolocation.getCurrentPosition(p=>{gps={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};gpsOk();},
    ()=>{if($('mG'))$('mG').textContent='Sin ubicación (permiso denegado)';},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function gpsOk(){const m=$('mG');if(m){m.classList.add('ok');m.textContent='Ubicación registrada ±'+gps.acc+' m';}}

async function guardarEvidencia(){
  const b=$('bsave');b.disabled=true;b.innerHTML='<span class="spin"></span> Guardando…';
  const id=uuid();const fecha=$('fec').value||today();const c=S.byCode.get(draft.clave);
  const cant=$('cant').value;
  const fila={id,obra_id:S.obra.id,concepto_clave:draft.clave,semana:semana(fecha)||null,fecha,descripcion:$('desc').value.trim(),
    comentario:$('com').value.trim()||null,cantidad:cant===''||c.es_grupo?null:Number(cant),avance_pct:draft.avance,
    lat:gps?gps.lat:null,lng:gps?gps.lng:null,precision_m:gps?gps.acc:null,
    fotos:draft.fotos.map((_,i)=>`${S.obra.id}/ev/${id}_${i+1}.jpg`)};
  const blobs=draft.fotos.map(f=>f.blob);
  try{await enviarEvidencia(fila,blobs);S.ev.push(fila);aplicarLocal(fila);toast('Evidencia guardada');actualizarAvance();}
  catch(e){console.warn(e);await colaPut({id,fila,blobs,obra:S.obra.nombre,creado:Date.now()});toast('Sin conexión: la evidencia quedó guardada en el teléfono y se enviará sola',5000);}
  draft={clave:draft.clave,fotos:[],avance:null};gps=null;tCapturar();window.scrollTo(0,0);
}
function aplicarLocal(fila){const c=S.byCode.get(fila.concepto_clave);if(!c)return;
  c.cantidad_ejecutada=S.ev.filter(e=>e.concepto_clave===c.clave).reduce((a,e)=>a+(Number(e.cantidad)||0),0);
  if(fila.avance_pct!=null)c.avance_pct=Math.max(Number(c.avance_pct)||0,fila.avance_pct);}
async function enviarEvidencia(fila,blobs){
  for(let i=0;i<blobs.length;i++)await conTiempo(subir(fila.fotos[i],blobs[i]),60000,'La subida tardó demasiado');
  await conTiempo(q(c=>c.from('obra_evidencias').upsert(fila,{onConflict:'id'})),30000);
}
let sincronizando=false;
async function sincronizarCola(){
  if(sincronizando||!navigator.onLine)return;sincronizando=true;
  try{const l=await colaTodo();let ok=0;
    for(const x of l){try{await enviarEvidencia(x.fila,x.blobs);await colaDel(x.id);ok++;if(S.obra&&S.obra.id===x.fila.obra_id&&!S.ev.some(e=>e.id===x.id))S.ev.push(x.fila);}catch(e){console.warn('cola',e.message);break;}}
    if(ok)toast(ok+' evidencia'+(ok>1?'s':'')+' pendiente'+(ok>1?'s':'')+' enviada'+(ok>1?'s':''));}
  finally{sincronizando=false;pintarPendientes();}
}
async function pintarPendientes(){const box=$('pendbox');if(!box)return;const l=await colaTodo();
  box.innerHTML=l.length?`<div class="pend"><span>${l.length} evidencia${l.length>1?'s':''} sin enviar (sin conexión)</span><button class="btn sm" id="reenv">Enviar ahora</button></div>`:'';
  if($('reenv'))$('reenv').onclick=sincronizarCola;}
window.addEventListener('online',sincronizarCola);
setInterval(sincronizarCola,60000);

/* buscador de conceptos */
let pHits=[],pCb=null;
function abrirBuscador(cb,soloHojas){pCb=cb;S._soloHojas=!!soloHojas;$('pq').value='';buscar();abrirHoja('pick');setTimeout(()=>$('pq').focus(),60);}
$('pickX').onclick=()=>cerrarHoja('pick');
function itemC(c,i){const g=grupoDe(c.clave);return `<div class="it${c.es_grupo?' grp':''}" data-i="${i}"><span class="code">${esc(c.clave)}</span>${esc(corto(c.descripcion,110))}<small>${esc(etiquetaPartida(c.partida))}${g&&g!==c.clave?' / '+esc(nombreC(g)):''}${c.unidad?' · '+esc(c.unidad):''} · ${pct(avanceC(c))}</small></div>`;}
function buscar(){
  const qq=norm($('pq').value);const box=$('pres');const base=S._soloHojas?hojas():S.cat;
  if(!qq){const rec=(JSON.parse(localStorage.getItem('obras-rec-'+S.obra.id)||'[]')).map(k=>S.byCode.get(k)).filter(Boolean);pHits=rec;
    box.innerHTML=rec.length?'<div class="lh">Usados recientemente</div>'+rec.map(itemC).join(''):'<p class="empty">Escribe una clave (5.04) o palabras del concepto (castillo k-1).</p>';return;}
  const toks=qq.split(' ');const pre=base.filter(c=>norm(c.clave).startsWith(qq));const ps=new Set(pre);
  pHits=pre.concat(base.filter(c=>!ps.has(c)&&toks.every(t=>norm(c.clave+' '+c.descripcion).includes(t)))).slice(0,80);
  box.innerHTML=pHits.length?pHits.map(itemC).join(''):'<p class="empty">Sin resultados</p>';
}
$('pq').oninput=buscar;
$('pq').onkeydown=e=>{if(e.key==='Enter'&&pHits[0]){e.preventDefault();elegir(pHits[0]);}};
$('pres').onclick=e=>{const d=e.target.closest('[data-i]');if(d)elegir(pHits[+d.dataset.i]);};
function elegir(c){try{const k='obras-rec-'+S.obra.id;const r=JSON.parse(localStorage.getItem(k)||'[]');localStorage.setItem(k,JSON.stringify([c.clave].concat(r.filter(x=>x!==c.clave)).slice(0,8)));}catch(e){}
  cerrarHoja('pick');pCb&&pCb(c);}

/* ─────────── CONCEPTOS ─────────── */
function tConceptos(){
  if(!S.cat.length){$('view').innerHTML='<div class="card"><p class="help">Sin catálogo cargado.</p></div>';return;}
  S.filtroC=S.filtroC||'todos';
  $('view').innerHTML=`<div class="seg" id="segC">${[['todos','Todos'],['proceso','En proceso'],['vencidos','Vencidos'],['terminados','Terminados']].map(([k,t])=>`<button data-k="${k}" class="${S.filtroC===k?'on':''}">${t}</button>`).join('')}</div>
    <div class="search">${IC.search}<input id="qc" placeholder="Buscar clave o concepto"></div><div id="clist"></div>`;
  const pint=()=>{
    const f=norm($('qc').value);const fl=S.filtroC;
    let l=hojas().filter(c=>{const a=avanceC(c);if(fl==='proceso'&&!(a>0&&a<100))return false;if(fl==='vencidos'&&!vencido(c))return false;if(fl==='terminados'&&a<100)return false;
      return !f||norm(c.clave+' '+c.descripcion).includes(f);});
    let h='',last=null;const max=300;
    l.slice(0,max).forEach(c=>{if(c.partida!==last){last=c.partida;h+=`<div class="wkh">${esc(etiquetaPartida(c.partida))}<span>${pct(avancePartida(c.partida))}</span></div>`;}
      const a=avanceC(c);const fin=finC(c);
      h+=`<button class="item" data-c="${esc(c.clave)}" style="display:block"><div class="pn"><span class="code">${esc(c.clave)}</span><span style="flex:1;min-width:0">${esc(corto(c.descripcion,70))}</span><span class="v">${pct(a)}</span></div>
      <div class="bar"><i class="${vencido(c)?'bad':''}" style="width:${a}%"></i></div>
      <div class="pl"><span>${fin?(c.fecha_fin_reprog?'Reprogramado ':'Termina ')+esc(fmtF(fin)):'Sin fecha programada'}</span>${vencido(c)?'<span class="chip red">Vencido</span>':a>=100?'<span class="chip ok">Terminado</span>':''}</div></button>`;});
    $('clist').innerHTML=h||'<p class="empty">Sin conceptos en este filtro.</p>';
    if(l.length>max)$('clist').insertAdjacentHTML('beforeend',`<p class="empty">Mostrando ${max} de ${l.length}. Usa el buscador.</p>`);
    $('clist').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>verConcepto(b.dataset.c));
  };
  $('segC').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;S.filtroC=b.dataset.k;$('segC').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));pint();};
  $('qc').oninput=pint;pint();
}
function verConcepto(k){S.concSel=k;push(vConcepto);}
function vConcepto(){
  barra(false);const c=S.byCode.get(S.concSel);if(!c){atras();return;}
  head(c.clave,etiquetaPartida(c.partida),true);
  const a=avanceC(c);const evs=S.ev.filter(e=>e.concepto_clave===c.clave).sort((x,y)=>y.fecha.localeCompare(x.fecha));
  const reps=S.reprog.filter(r=>r.concepto_clave===c.clave).sort((x,y)=>y.creado_en.localeCompare(x.creado_en));
  const pr=esDir()?S.precios.get(c.clave):null;
  $('view').innerHTML=`
    <div class="card"><p style="margin:0 0 10px;font-size:15px">${esc(c.descripcion)}</p>
      <div class="pn"><span>Cumplimiento</span><span class="v">${pct(a)}</span></div><div class="bar"><i class="${vencido(c)?'bad':''}" style="width:${a}%"></i></div>
      <div class="pl"><span>Ejecutado ${num(c.cantidad_ejecutada)} de ${num(c.cantidad)} ${esc(c.unidad||'')}</span>${vencido(c)?'<span class="chip red">Vencido</span>':''}</div>
      ${pr?`<p class="help" style="margin:10px 0 0">P.U. ${money(pr.pu)} · Importe ${money(pr.importe)}${pr.sin_importe?' · <b>sin importe en el catálogo</b>':''}</p>`:''}</div>
    <div class="card"><h3>Fechas</h3>
      <div class="pl" style="font-size:14px"><span>Inicio programado</span><b>${esc(fmtF(c.fecha_inicio_prog))}</b></div>
      <div class="pl" style="font-size:14px"><span>Fin programado</span><b>${esc(fmtF(c.fecha_fin_prog))}</b></div>
      ${c.fecha_fin_reprog?`<div class="pl" style="font-size:14px"><span>Fin reprogramado</span><b style="color:var(--warn)">${esc(fmtF(c.fecha_fin_reprog))}</b></div>`:''}
      <div class="pl" style="font-size:14px"><span>Fin real</span><b>${esc(fmtF(c.fecha_fin_real))}</b></div>

      ${puedeCap()&&a<100&&!c.es_grupo?`<button class="btn ghost sm" id="bFin">${IC.check}Marcar terminado</button>`:''}</div></div>

      <p style="margin:4px 0;font-size:14px">${esc(r.motivo)}</p>${r.evidencia?`<div class="gal" style="grid-template-columns:repeat(4,1fr)"><figure><img data-p="${esc(r.evidencia)}" alt=""></figure></div>`:''}</div>`).join('')}</div>`:''}

function formReprogramar(c){
  const fotos=[];
  form('Reprogramar '+c.clave,`<p class="help">${esc(corto(c.descripcion,120))}<br>Fecha actual: <b>${esc(fmtF(finC(c)))}</b></p>

  const pint=()=>{$('rpf').innerHTML=fotos.length?`<div class="slot"><img src="${fotos[0].url}" alt=""><button class="x" id="rpx">${IC.x}</button></div>`:`<button class="slot first" id="rpc" type="button">${IC.cam}Tomar foto</button><button class="slot" id="rpg" type="button">Galería</button>`;
    if($('rpc'))$('rpc').onclick=()=>{fotoDestino=fotos;fotoCb=pint;$('fcam').click();};if($('rpg'))$('rpg').onclick=()=>{fotoDestino=fotos;fotoCb=pint;$('fgal').click();};

async function generarPPTX(w,lista){
  const pres=new PptxGenJS();pres.layout='LAYOUT_WIDE';pres.author='Tecnocontrol';pres.title='Reporte semanal '+w;
  const W=13.333,F='Arial',NAVY='1D2E73',BG='26366E';
  const obra=(S.obra.nombre||'').toUpperCase(),ubi=(S.obra.ubicacion||'').toUpperCase();
  const l=[...lista].sort((x,y)=>cmpCode(x.concepto_clave,y.concepto_clave)||x.fecha.localeCompare(y.fecha));
  const cropP=async(p,ar)=>recortar(await fotoDataURL(p),ar);
  const footer=(s,p1,p2)=>{
    s.addShape(pres.ShapeType.rect,{x:0,y:6.62,w:W,h:0.88,fill:{color:'FFFFFF'},line:{color:'FFFFFF'}});
    s.addText([{text:'REPORTE SEMANAL '+w,options:{bold:true,fontSize:17,breakLine:true}},{text:'OBRA: ',options:{bold:true,fontSize:8}},{text:obra,options:{fontSize:8,breakLine:true}},{text:'UBICACIÓN: ',options:{bold:true,fontSize:8}},{text:ubi,options:{fontSize:8}}],
      {x:0.2,y:6.64,w:5.0,h:0.84,valign:'middle',color:'1B2133',fontFace:F,margin:0,fit:'shrink',isTextBox:true});
    const lw=2.4;s.addImage({data:LOGO,x:(W-lw)/2,y:6.66,w:lw,h:lw*LOGO_AR});
    const r=[{text:'PARTIDA:',options:{bold:true,breakLine:true}},{text:p1,options:{breakLine:!!p2}}];if(p2)r.push({text:p2});
    s.addText(r,{x:8.5,y:6.64,w:4.63,h:0.84,align:'right',valign:'middle',fontSize:10,color:'1B2133',fontFace:F,margin:0,isTextBox:true});
  };
  // portada
  const [a,b]=rango(w);
  const cs=pres.addSlide();cs.background={color:NAVY};
  const ck=((S.cover||{})[w]||'').split(':');const cev=l.find(v=>v.id===ck[0])||l[0];const cf=cev&&cev.fotos&&cev.fotos[+ck[1]||0];
  if(cf){cs.addImage({data:await cropP(cf,W/7.5),x:0,y:0,w:W,h:7.5});cs.addShape(pres.ShapeType.rect,{x:0,y:0,w:W,h:7.5,fill:{color:'000000',transparency:45},line:{color:'000000',transparency:100}});}
  cs.addShape(pres.ShapeType.roundRect,{x:0.35,y:0.35,w:4.3,h:1.45,fill:{color:'FFFFFF'},line:{color:'FFFFFF'},rectRadius:0.12});
  cs.addImage({data:LOGO,x:0.55,y:0.55,w:3.9,h:3.9*LOGO_AR});
  cs.addText('REPORTE DE\nAVANCE SEMANA '+w,{x:5.6,y:0.3,w:7.4,h:1.7,align:'right',fontSize:40,bold:true,color:'FFFFFF',fontFace:F,margin:0,isTextBox:true});
  cs.addText([{text:obra,options:{bold:true,breakLine:true}},{text:ubi}],{x:6.6,y:2.05,w:6.4,h:1.0,align:'right',valign:'top',fontSize:13,color:'FFFFFF',fontFace:F,margin:0,isTextBox:true});
  const fe=$('rf')&&$('rf').value?pd($('rf').value):new Date(b.getTime()+DAY);
  cs.addText([{text:fmtD(fe),options:{fontSize:20,bold:true,breakLine:true}},{text:'Periodo: '+fmtS(a)+' al '+fmtS(b)+' de '+b.getFullYear(),options:{fontSize:12}}],{x:0,y:6.45,w:W,h:0.85,align:'center',color:'FFFFFF',fontFace:F,margin:0,isTextBox:true});

  // por partida
  const parOf=v=>(S.byCode.get(v.concepto_clave)||{}).partida||String(v.concepto_clave).split('.')[0];
  const tops=[...new Set(l.map(parOf))].sort(cmpCode);
  for(const t of tops){
    const evs=l.filter(v=>parOf(v)===t);const p1=etiquetaPartida(t);
    for(const v of evs){
      const g=grupoDe(v.concepto_clave);const p2=g&&g!==v.concepto_clave?nombreC(g):'';
      const s=pres.addSlide();s.background={color:BG};
      s.addShape(pres.ShapeType.roundRect,{x:1.0,y:0.15,w:11.33,h:0.62,fill:{color:'FFFFFF'},line:{color:'C00000',width:1.5},rectRadius:0.1});
      s.addText(v.descripcion,{x:1.1,y:0.15,w:11.13,h:0.62,align:'center',valign:'middle',fontSize:15,color:'1B2133',fontFace:F,margin:0,fit:'shrink',isTextBox:true});
      const k=(v.fotos||[]).length||1,gap=0.15,X0=0.2,TW=12.93,Y=0.9,H=5.6;const pw=(TW-gap*(k-1))/k;
      for(let i=0;i<(v.fotos||[]).length;i++){s.addImage({data:await cropP(v.fotos[i],pw/H),x:X0+i*(pw+gap),y:Y,w:pw,h:H});}
      footer(s,p1,p2);
    }
    // resumen de conceptos de la partida
    const codes=[...new Set(evs.map(v=>v.concepto_clave))].sort(cmpCode);
    const rowsAll=codes.map(c=>{const x=S.byCode.get(c)||{};const cs=evs.filter(v=>v.concepto_clave===c&&v.cantidad!=null);const cant=cs.reduce((s,v)=>s+Number(v.cantidad),0);
      return [c,corto(x.descripcion,150)||c,x.unidad||'',cs.length?num(cant):'—',x.clave?pct(avanceC(x)):'—'];});
    for(let i=0;i<rowsAll.length;i+=9){
      const s=pres.addSlide();s.background={color:BG};
      s.addText('Conceptos con avance en la semana'+(rowsAll.length>9?' ('+(i/9+1)+')':''),{x:0.4,y:0.25,w:12.5,h:0.55,fontSize:20,bold:true,color:'FFFFFF',fontFace:F,margin:0,isTextBox:true});
      const hdr=['Clave','Concepto','Unidad','Cantidad semana','Avance'].map(t=>({text:t,options:{bold:true,color:'FFFFFF',fill:{color:NAVY}}}));
      s.addTable([hdr,...rowsAll.slice(i,i+9)],{x:0.4,y:0.95,w:12.53,colW:[1.2,8.03,0.9,1.4,1.0],fontSize:12,fontFace:F,color:'1B2133',fill:{color:'FFFFFF'},border:{type:'solid',pt:0.5,color:'C9CEDC'},valign:'middle',margin:0.06});
      footer(s,p1,'');
    }
  }
  const slug=(S.obra.nombre||'obra').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  await pres.writeFile({fileName:`Reporte_Semanal_${w}_${slug}.pptx`});
  toast('Reporte de la semana '+w+' descargado');
}

/* ─────────── CATÁLOGO Y PROGRAMA (importar) ─────────── */
let importado=null;
function vCatalogo(){
  barra(false);head('Catálogo y programa',S.obra.nombre,true);
  const hs=hojas();
  $('view').innerHTML=`<div class="card"><h3>Estado actual</h3><p class="help" style="margin:0">${hs.length?`<b>${hs.length}</b> conceptos en <b>${partidas().length}</b> partidas.`:'Sin catálogo.'} ${S.programa.length?'Programa de trabajo cargado.':'Sin programa de trabajo.'}</p></div>
    <div class="card"><h3>Importar desde OPUS o Excel</h3><p class="help">Acepta el Excel de estimación (cuerpo de estimación y adicionales) o la exportación de OPUS con columna NIVEL, y el programa de trabajo por partida y mes. Puede venir todo en un archivo o en archivos separados.</p>
      <button class="btn" id="bx">${IC.up}Elegir archivo Excel</button><div id="prev"></div></div>
    <p class="help">Al volver a importar se actualizan descripciones y cantidades. El avance, las evidencias y las fechas que ya capturaste no se pierden.</p>`;
  $('bx').onclick=()=>$('fxls').click();
}
$('fxls').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});importado=parseWB(wb);mostrarPrevia(f.name);}
  catch(err){console.error(err);toast('No se pudo leer el archivo: '+err.message,5000);}
};
function mesesProg(p){
  const base=S.obra.fecha_inicio?pd(S.obra.fecha_inicio):new Date();const idx=p.meses.map(m=>MESES.indexOf(norm(m)));
  if(idx.some(i=>i<0))return p.meses.map((_,k)=>new Date(base.getFullYear(),base.getMonth()+k,1));
  let y=base.getFullYear();if(idx[0]<base.getMonth()-6)y++;
  return idx.map((m,k)=>{if(k>0&&m<idx[k-1])y++;return new Date(y,m,1);});
}
function mostrarPrevia(nombre){
  const {cat,prog}=importado;const par=new Set();
  cat.forEach(x=>{if(isNumCode(x.c)){const p=x.c.split('.');for(let i=1;i<p.length;i++)par.add(p.slice(0,i).join('.'));}});
  importado.par=par;
  const hs=cat.filter(x=>x.c!=='AD'&&x.l>1&&!par.has(x.c));const sin=hs.filter(x=>x.sinImp);
  const tot=hs.reduce((a,x)=>a+(x.q&&x.pu&&!x.sinImp?x.q*x.pu:0),0);
  let h=`<div class="warn" style="margin-top:12px;background:#eef1fb;border-color:#c9d1ee"><b>${esc(nombre)}</b><br>`;
  h+=cat.length?`${hs.length} conceptos en ${new Set(cat.map(x=>topOf(x.c))).size} partidas${esDir()?' · importe '+money(tot):''}`:'Sin catálogo en este archivo';
  if(prog){const ms=mesesProg(prog);h+=`<br>Programa: ${prog.filas.length} partidas, ${esc(prog.meses[0])} ${ms[0].getFullYear()} a ${esc(prog.meses[prog.meses.length-1])} ${ms[ms.length-1].getFullYear()}${prog.ant!=null?', anticipo '+Math.round(prog.ant*100)+'%':''}`;}
  h+='</div>';
  if(sin.length&&esDir())h+=`<div class="warn">${sin.length} conceptos tienen cantidad y P.U. pero sin importe en el Excel (${money(sin.reduce((a,x)=>a+x.q*x.pu,0))}). Se importan marcados como "sin importe".</div>`;
  if(prog&&!S.obra.fecha_inicio)h+=`<div class="warn">La obra no tiene fecha de la semana 1; los meses del programa se ubicarán en el año actual.</div>`;
  h+=`<button class="btn red" id="bimp">${IC.check}Importar a la obra</button>`;
  $('prev').innerHTML=h;$('bimp').onclick=importar;
}
async function importar(){
  const b=$('bimp');b.disabled=true;b.innerHTML='<span class="spin"></span> Importando…';
  try{
    const {cat,prog,par}=importado;const id=S.obra.id;
    // fechas por partida a partir del programa
    const fechas=new Map();
    if(prog){const ms=mesesProg(prog);prog.filas.forEach(f=>{const i0=f.pct.findIndex(p=>p>0);let i1=-1;f.pct.forEach((p,i)=>{if(p>0)i1=i;});
      if(i0>=0)fechas.set(f.c,[iso(ms[i0]),iso(new Date(ms[i1].getFullYear(),ms[i1].getMonth()+1,0))]);});}
    if(cat.length){
      const conF=[],sinF=[];
      cat.forEach((x,i)=>{const p=topOf(x.c);const grp=x.c==='AD'||x.l===1||par.has(x.c);
        const base={obra_id:id,clave:x.c,partida:p,nivel:x.l,descripcion:x.n,unidad:x.u||null,cantidad:grp?null:x.q,es_grupo:grp,es_equipo:!!x.eq,es_adicional:!isNumCode(x.c),orden:i};
        const ex=S.byCode.get(x.c);const fp=fechas.get(p);
        if(fp&&!(ex&&ex.fecha_inicio_prog))conF.push({...base,fecha_inicio_prog:fp[0],fecha_fin_prog:fp[1]});else sinF.push(base);});
      for(const arr of [conF,sinF])for(let i=0;i<arr.length;i+=500){const lote=arr.slice(i,i+500);await q(c=>c.from('obra_conceptos').upsert(lote,{onConflict:'obra_id,clave'}));b.innerHTML=`<span class="spin"></span> Conceptos ${Math.min(i+500,arr.length)}/${arr.length}…`;}
      if(esDir()){const pr=cat.filter(x=>!par.has(x.c)&&x.pu!=null).map(x=>({obra_id:id,clave:x.c,pu:x.pu,importe:x.q!=null&&!x.sinImp?x.q*x.pu:null,sin_importe:!!x.sinImp}));
        for(let i=0;i<pr.length;i+=500)await q(c=>c.from('obra_precios').upsert(pr.slice(i,i+500),{onConflict:'obra_id,clave'}));}
    }
    if(prog){const ms=mesesProg(prog);
      await q(c=>c.from('obra_programa').delete().eq('obra_id',id));
      const rows=[];prog.filas.forEach(f=>f.pct.forEach((p,k)=>rows.push({obra_id:id,partida:f.c,mes:iso(ms[k]),pct:p||0})));
      if(rows.length)await q(c=>c.from('obra_programa').insert(rows));
      if(esDir()&&prog.ant!=null){const r=await q(c=>c.from('obras').update({anticipo_pct:prog.ant}).eq('id',id).select().single());S.obra=r;}
    }
    await cargarDatos();toast('Importación terminada');pintar();
  }catch(e){console.error(e);toast('Error al importar: '+e.message,6000);b.disabled=false;b.innerHTML=IC.check+'Importar a la obra';}
}

/* ─────────── ESTIMACIÓN Y PROGRAMA DE PAGOS (solo Dirección) ─────────── */
function vEstimacion(){
  barra(false);head('Estimación y pagos',S.obra.nombre,true);
  const P=S.precios;const imp=k=>{const x=P.get(k);return x&&x.importe?Number(x.importe):0;};const pu=k=>{const x=P.get(k);return x&&x.pu!=null?Number(x.pu):null;};
  const parts=partidas();const corte=new Date();
  const impPar=new Map(parts.map(p=>[p,hojas().filter(c=>c.partida===p).reduce((a,c)=>a+imp(c.clave),0)]));
  const T=[...impPar.values()].reduce((a,b)=>a+b,0);
  const ejec=c=>{const v=pu(c.clave);return v!=null?Math.min(Number(c.cantidad_ejecutada)||0,Number(c.cantidad)||Infinity)*v:0;};
  const TE=hojas().reduce((a,c)=>a+ejec(c),0);
  let TP=0;parts.forEach(p=>{const pp=programadoPartida(p,corte);if(pp!=null)TP+=impPar.get(p)*pp/100;});
  const ant=Number(S.obra.anticipo_pct)||0,iva=S.obra.iva_pct!=null?Number(S.obra.iva_pct):.16;
  const meses=[...new Set(S.programa.map(r=>r.mes))].sort();
  const curW=Math.max(1,semana(today()));
  $('view').innerHTML=`
    ${T?'':'<div class="warn">No hay precios cargados. Importa el Excel de estimación desde Catálogo y programa.</div>'}
    <div class="kpis"><div><small>Contrato (sin IVA)</small><b style="font-size:19px">${money(T)}</b></div>
      <div><small>Programado al día</small><b>${T?pct(TP/T*100):'—'}</b><small>${money(TP)}</small></div>
      <div class="${TE<TP?'bad':'good'}"><small>Ejecutado medido</small><b>${T?pct(TE/T*100):'—'}</b><small>${money(TE)}</small></div></div>
    ${meses.length?`<div class="card"><h3>Programa de pagos</h3><p class="help">Anticipo ${pct(ant*100)} amortizado en cada estimación · IVA ${pct(iva*100)}</p><div class="tw"><table><thead><tr><th>Mes</th><th>Programado</th><th>Ejecutado medido</th><th>Amortización</th><th>Cobro neto</th><th>Con IVA</th></tr></thead><tbody>
      ${meses.map(m=>{const a=pd(m),b=new Date(a.getFullYear(),a.getMonth()+1,0);const pr=S.programa.filter(r=>r.mes===m).reduce((s,r)=>s+(impPar.get(r.partida)||0)*Number(r.pct),0);
        const ej=S.ev.filter(e=>e.cantidad!=null&&e.fecha>=iso(a)&&e.fecha<=iso(b)).reduce((s,e)=>s+Number(e.cantidad)*(pu(e.concepto_clave)||0),0);
        return `<tr><td>${MESES[a.getMonth()].slice(0,3)} ${a.getFullYear()}</td><td class="n">${money(pr)}</td><td class="n">${a>corte?'—':money(ej)}</td><td class="n">${money(pr*ant)}</td><td class="n">${money(pr*(1-ant))}</td><td class="n">${money(pr*(1-ant)*(1+iva))}</td></tr>`;}).join('')}
      </tbody></table></div></div>`:''}
    <div class="card"><h3>Resumen para estimación</h3><div class="row2"><div><label for="e1" style="margin-top:0">Desde semana</label><select id="e1"></select></div><div><label for="e2" style="margin-top:0">Hasta semana</label><select id="e2"></select></div></div>
      <div class="tw"><table id="et"></table></div><div class="btns"><button class="btn ghost sm" id="exl">${IC.dl}Descargar Excel</button></div></div>`;
  const opts=Array.from({length:curW},(_,i)=>i+1).map(w=>{const [a,b]=rango(w);return `<option value="${w}">Semana ${w} (${fmtS(a)} – ${fmtS(b)})</option>`;}).join('');
  $('e1').innerHTML=opts;$('e2').innerHTML=opts;$('e1').value=Math.max(1,curW-4);$('e2').value=curW;
  const filas=()=>{const a=+$('e1').value,b=+$('e2').value;const l=S.ev.filter(e=>{const w=e.semana||semana(e.fecha);return w>=Math.min(a,b)&&w<=Math.max(a,b);});
    return [...new Set(l.map(e=>e.concepto_clave))].sort(cmpCode).map(k=>{const c=S.byCode.get(k)||{};const m=l.filter(e=>e.concepto_clave===k&&e.cantidad!=null);
      const cant=m.length?m.reduce((s,e)=>s+Number(e.cantidad),0):null;const p=pu(k);return {k,n:corto(c.descripcion,120),u:c.unidad||'',q:c.cantidad,pu:p,cant,imp:cant!=null&&p!=null?cant*p:null,ev:l.filter(e=>e.concepto_clave===k).length};});};
  const pint=()=>{const r=filas();const t=r.reduce((s,x)=>s+(x.imp||0),0);
    $('et').innerHTML=r.length?`<thead><tr><th>Clave</th><th>Concepto</th><th>Unidad</th><th>Cant. contrato</th><th>P.U.</th><th>Cant. ejecutada</th><th>Importe</th><th>Evid.</th></tr></thead><tbody>`+
      r.map(x=>`<tr><td><span class="code">${esc(x.k)}</span></td><td>${esc(x.n)}</td><td>${esc(x.u)}</td><td class="n">${num(x.q)}</td><td class="n">${money(x.pu)}</td><td class="n">${x.cant==null?'por medir':num(x.cant)}</td><td class="n">${money(x.imp)}</td><td class="n">${x.ev}</td></tr>`).join('')+
      `<tr class="tot"><td colspan="6">Importe estimable (sin IVA)</td><td class="n">${money(t)}</td><td></td></tr></tbody>`:'<tr><td class="empty">Sin evidencias en ese rango.</td></tr>';};
  $('e1').onchange=$('e2').onchange=pint;pint();
  $('exl').onclick=()=>{const r=filas();if(!r.length){toast('Sin datos');return;}
    const aoa=[['Clave','Concepto','Unidad','Cant. contrato','P.U.','Cant. ejecutada','Importe']];
    r.forEach((x,i)=>aoa.push([x.k,x.n,x.u,x.q,x.pu,x.cant,x.cant!=null&&x.pu!=null?{f:`E${i+2}*F${i+2}`}:null]));aoa.push(['','TOTAL','','','','',{f:`SUM(G2:G${r.length+1})`}]);
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:11},{wch:70},{wch:8},{wch:14},{wch:13},{wch:15},{wch:15}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Resumen');XLSX.writeFile(wb,`Estimacion_${(S.obra.nombre||'obra').replace(/[^A-Za-z0-9]+/g,'_')}_S${$('e1').value}-S${$('e2').value}.xlsx`);};
}
